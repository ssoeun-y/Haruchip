    <script>
        function getCategoryEmoji(key) {
            const emojis = {
                couple: '❤️',
                solo: '🌟',
                military: '🎖️',
                exam: '📚',
                birthday: '🎂',
                pet: '🐾',
                plan: '📝',
                baby: '👶'
            };
            return emojis[key] || '📌';
        }

        // 다중 결제자 정산 — 부채 최소화(debt simplification) 계산
        // payments: {이름: 낸금액}, members: 참여자 전체 이름 배열
        // 반환: { total, share, tx: [{from, to, amount}] }
        function calculateSettlement(payments, members) {
            const total = Object.values(payments).reduce((a, b) => a + b, 0);
            const share = Math.round(total / members.length);
            let balances = members.map(name => ({ name, balance: (payments[name] || 0) - share }));
            let creditors = balances.filter(b => b.balance > 0).sort((a, b) => b.balance - a.balance);
            let debtors = balances.filter(b => b.balance < 0).sort((a, b) => a.balance - b.balance);
            let i = 0, j = 0, tx = [];
            while (i < debtors.length && j < creditors.length) {
                const d = debtors[i], c = creditors[j];
                const amt = Math.min(-d.balance, c.balance);
                if (amt > 0) tx.push({ from: d.name, to: c.name, amount: amt });
                d.balance += amt; c.balance -= amt;
                if (Math.abs(d.balance) < 1) i++;
                if (Math.abs(c.balance) < 1) j++;
            }
            return { total, share, tx };
        }

        // App State
        let currentScreen = 'onboarding'; // onboarding, main
        let currentTab = 'dashboard';
        let onboardingStep = 1;
        let viewMode = 'vertical'; // vertical, box
        let selectedCategories = ['couple', 'exam', 'birthday', 'pet'];
        let calendarSyncType = 'google'; // google, naver, haru

                solo: { active: true, title: "솔로 / 최애 덕질", targetName: "프로젝트 앨범 발매", ddayDate: "2026-09-01" },
                military: { active: false, title: "군대 (곰신)", enlistDate: "2024-03-10", dischargeDate: "2025-12-09" },

                birthday: { active: true, title: "생일", birthdays: [{name: "엄마 생신", date: "2026-10-12"}, {name: "베프 지민", date: "2026-11-04"}] },
                pet: { active: true, title: "반려동물", petName: "초코 (포메라니안)", birthDate: "2023-08-20" },

                { id: 2, name: "팀 프로젝트 회식", code: "TEAM99", members: [{name: "하루", icon: "🐥"}, {name: "팀장님", icon: "🦁"}, {name: "인턴", icon: "🐰"}], dates: {"2026-06-10": ["하루", "팀장님"]}, settlement: { title: "팀 프로젝트 회식 정산", payments: {"팀장님": 45000} } }
            ]
        };

        // Initialize Lucide Icons
        function renderIcons() {
            lucide.createIcons();
        }

        // Boot app
        window.addEventListener('DOMContentLoaded', () => {
            renderScreen();
        });

        function renderScreen() {
            const container = document.getElementById('screen-container');
            const header = document.getElementById('app-header');
            const nav = document.getElementById('bottom-nav');

            if (currentScreen === 'onboarding') {
                header.classList.add('hidden');
                nav.classList.add('hidden');
                container.innerHTML = renderOnboardingHTML();
            } else {
                header.classList.remove('hidden');
                nav.classList.remove('hidden');
                if (currentTab === 'dashboard') {
                    container.innerHTML = renderDashboardHTML();
                } else if (currentTab === 'calendar') {
                    container.innerHTML = renderCalendarHTML();
                } else if (currentTab === 'rooms') {
                    container.innerHTML = renderRoomsHTML();
                } else if (currentTab === 'coupleRoom') {
                    container.innerHTML = renderCoupleRoomHTML();
                }
            }
            renderIcons();
        }

        function renderOnboardingHTML() {
            if (onboardingStep === 1) {
                return `
                <div class="p-6 flex flex-col items-center justify-center min-h-screen text-center bg-gradient-to-b from-yellow-50 to-white">

                    <span class="px-3 py-1 bg-yellow-100 text-amber-800 text-xs font-semibold rounded-full mb-3">스마트 디데이 & 일정 관리</span>
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">소중한 날들을 더 특별하게,<br>하루칩과 함께 시작해요</h2>
                    <p class="text-gray-500 text-sm mb-8">커플, 시험, 생일, 군대, 반려동물까지 모든 디데이를 한눈에 관리하세요.</p>

            } else if (onboardingStep === 2) {

                            }).join('')}

            } else if (onboardingStep === 3) {

                <div class="p-6 flex flex-col justify-between min-h-screen py-12">
                    <div>
                        <div class="flex items-center space-x-2 text-amber-600 font-semibold text-sm mb-2"><span>STEP 2/3</span></div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">대시보드 보기 방식 선택</h2>
                        <p class="text-gray-500 text-sm mb-6">메인 화면에서 정보를 어떤 형태로 확인할까요?</p>

                            <label class="flex items-center p-4 rounded-2xl border-2 border-yellow-300 bg-yellow-50 cursor-pointer">

                        </div>

                        <h2 class="text-2xl font-bold text-gray-900 mb-2">설정이 완료되었습니다!</h2>
                        <p class="text-gray-500 text-sm mb-8">구글/네이버 캘린더 연동 및 위젯 가이드가 준비되었어요. 이제 하루칩의 모든 기능을 만나보세요.</p>

        function toggleCategory(key) {
            if (selectedCategories.includes(key)) {
                selectedCategories = selectedCategories.filter(k => k !== key);
            } else {
                selectedCategories.push(key);
            }
            renderScreen();
        }

        function nextOnboarding() {
            onboardingStep++;
            renderScreen();
        }

        function finishOnboarding() {
            currentScreen = 'main';
            renderScreen();
        }

                        <h2 class="text-xl font-bold mt-1">안녕하세요, ${appState.user.name}님!</h2>
                        <p class="text-xs text-amber-800 mt-0.5">다가오는 기념일과 일정을 확인하세요.</p>

                    <div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-2xl">

                    <div class="flex bg-gray-100 p-1 rounded-xl text-xs font-medium">
                        <button onclick="setViewMode('vertical')" class="px-3 py-1 rounded-lg ${viewMode === 'vertical' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}">세로형</button>

                    </div>
                </div>

                <!-- Category Cards Feed -->
                <div class="${viewMode === 'box' ? 'grid grid-cols-2 gap-3' : 'space-y-4'}">
                    
                    <!-- COUPLE CARD -->
                    ${selectedCategories.includes('couple') ? `
                    <div onclick="switchTab('coupleRoom')" class="bg-gradient-to-br from-pink-50 to-white border border-pink-100 p-4 rounded-3xl shadow-sm cursor-pointer hover:shadow-md transition relative overflow-hidden group">

                                    <h4 class="font-bold text-gray-900 text-sm">우리 사랑한 지</h4>

                appState.categories.exam.exams.push({ name: title, date: date || '2026-12-31' });
            } else if(categoryKey === 'birthday') {
                appState.categories.birthday.birthdays.push({ name: title, date: date || '2026-12-31' });
            }
            closeModal();
            renderScreen();
            showToast("✨ 새로운 항목이 추가되었습니다!");
        }

        function openAddScheduleModal() {
            openAddModal('exam');
        }

        function confirmCalendarSync(type) {
            closeModal();
            showToast(`✨ ${type}에 일정이 성공적으로 등록되었습니다!`);
        }

        function openSyncSettings() {
            openModal('settingsModal');
        }

        function openCreateRoomModal() {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
            <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-lg text-gray-900">새로운 일정·정산 방 만들기</h3>
                        <button onclick="closeModal()" class="p-1.5 text-gray-400 hover:text-gray-600 rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="font-semibold text-gray-700 block mb-1">방 이름</label>
                            <input type="text" id="newRoomName" placeholder="예: 회사 동기 소모임" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-2xl focus:outline-none focus:border-yellow-400">
                        </div>
                    </div>
                    <button onclick="createRoomAction()" class="w-full py-3.5 bg-yellow-400 hover:bg-yellow-500 text-amber-950 font-bold rounded-2xl shadow-sm transition">방 만들기 및 초대코드 생성</button>
                </div>
            </div>`;
            renderIcons();
        }

        function createRoomAction() {
            const nameInput = document.getElementById('newRoomName').value;
            if(!nameInput) return;
            appState.scheduleRooms.push({
                id: Date.now(),
                name: nameInput,
                code: "ROOM" + Math.floor(Math.random()*900+100),
                members: [{name: "하루", icon: "🐥"}],
                dates: {}
            });
            closeModal();
            renderScreen();
            showToast("🎉 새로운 모임 방이 생성되었습니다!");
        }

        // 일정 방 상세 — 멤버별 가능 날짜 표시/확정
        function generateRoomDateRange() {
            const base = new Date('2026-06-08');
            const out = [];
            for (let i = 0; i < 8; i++) {
                const d = new Date(base); d.setDate(base.getDate() + i);
                out.push(d.toISOString().slice(0, 10));
            }
            return out;
        }

        function formatShortDate(dateStr) {
            const d = new Date(dateStr);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            return `${d.getMonth() + 1}/${d.getDate()}(${days[d.getDay()]})`;
        }

        function openRoomDetailModal(roomId) {
            const room = appState.scheduleRooms.find(r => r.id === roomId);
            const dateList = generateRoomDateRange();
            const memberCount = room.members.length;
            let bestDate = null, bestCount = 0;
            dateList.forEach(d => {
                const c = (room.dates[d] || []).length;
                if (c > bestCount) { bestCount = c; bestDate = d; }
            });

            const container = document.getElementById('modal-container');
            container.innerHTML = `
            <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-lg text-gray-900">${room.name}</h3>
                            <p class="text-[11px] text-gray-400">초대코드 ${room.code} · 멤버 ${memberCount}명</p>
                        </div>
                        <button onclick="closeModal()" class="p-1.5 text-gray-400 hover:text-gray-600 rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <div class="flex flex-wrap gap-1.5">
                        ${room.members.map(m => `<span class="px-2 py-1 bg-gray-50 rounded-lg text-[11px] font-medium text-gray-700">${m.icon} ${m.name}</span>`).join('')}
                    </div>

                    <div>
                        <p class="text-xs font-semibold text-gray-700 mb-2">가능한 날짜를 탭해서 표시해주세요 (나: 하루 🐥)</p>
                        <div class="grid grid-cols-4 gap-2">
                            ${dateList.map(d => {
                                const avail = room.dates[d] || [];
                                const isMe = avail.includes('하루');
                                const isFull = avail.length === memberCount && memberCount > 0;
                                return `
                                <div onclick="toggleAvailability(${roomId},'${d}')" class="cursor-pointer rounded-2xl p-2 text-center border-2 transition ${isFull ? 'border-amber-400 bg-amber-50' : isMe ? 'border-yellow-300 bg-yellow-50' : 'border-gray-100 bg-white hover:border-yellow-200'}">
                                    <div class="text-[11px] font-bold text-gray-700">${formatShortDate(d)}</div>
                                    <div class="flex justify-center flex-wrap gap-0.5 mt-1 min-h-[14px]">
                                        ${avail.map(name => {
                                            const ic = (room.members.find(m => m.name === name) || {}).icon || '👤';
                                            return `<span class="text-[10px]">${ic}</span>`;
                                        }).join('')}
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                        <div class="flex items-center gap-3 mt-3 text-[10px] text-gray-400">
                            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-400 inline-block"></span>전원 가능</span>
                            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-yellow-300 inline-block"></span>내가 체크함</span>
                        </div>
                    </div>

                    ${bestCount > 0 ? `
                    <div class="bg-yellow-50/70 p-3 rounded-2xl border border-yellow-100 text-xs">
                        <span class="font-bold text-amber-900 block">✨ 최다 인원 가능일: ${formatShortDate(bestDate)} (${bestCount}/${memberCount}명)</span>
                        <button onclick="confirmRoomDate(${roomId},'${bestDate}')" class="mt-2 w-full py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl">이 날짜로 확정하기</button>
                    </div>` : `<p class="text-xs text-gray-400 text-center py-2">아직 아무도 가능 날짜를 표시하지 않았어요</p>`}

                    <button onclick="openSettlementModal(${roomId})" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl transition text-sm">정산하기로 이동</button>
                </div>
            </div>`;
            renderIcons();
        }

        function toggleAvailability(roomId, date) {
            const room = appState.scheduleRooms.find(r => r.id === roomId);
            if (!room.dates[date]) room.dates[date] = [];
            const idx = room.dates[date].indexOf('하루');
            if (idx >= 0) room.dates[date].splice(idx, 1);
            else room.dates[date].push('하루');
            openRoomDetailModal(roomId);
        }

        function confirmRoomDate(roomId, date) {
            closeModal();
            showToast(`🎉 ${formatShortDate(date)} 일정이 확정되어 캘린더에 자동 등록되었습니다!`);
        }

        function openSettlementModal(roomId) {
            const room = appState.scheduleRooms.find(r => r.id === roomId);
            const memberNames = room.members.map(m => m.name);
            const iconOf = name => (room.members.find(m => m.name === name) || {}).icon || '👤';
            const { total, share, tx } = calculateSettlement(room.settlement.payments, memberNames);
            const paidBy = Object.entries(room.settlement.payments).map(([name, amt]) => `${name} ${amt.toLocaleString()}원`).join(' · ');

            const container = document.getElementById('modal-container');
            container.innerHTML = `
            <div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-lg text-gray-900">정산하기</h3>
                        <button onclick="closeModal()" class="p-1.5 text-gray-400 hover:text-gray-600 rounded-xl"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <p class="text-xs text-gray-500"><b>${room.name}</b> · ${memberNames.length}명 · 1인당 ${share.toLocaleString()}원</p>

                    <div class="p-3 bg-yellow-50 rounded-2xl text-xs space-y-1">
                        <div class="flex justify-between font-bold"><span>총 금액</span><span class="text-amber-800">${total.toLocaleString()}원</span></div>
                        <div class="text-gray-500">결제자: ${paidBy}</div>
                    </div>

                    <div class="space-y-2">
                        <span class="font-semibold text-gray-700 text-xs block">보내야 할 금액 (최소 송금 횟수로 자동 계산)</span>
                        ${tx.length === 0 ? `<p class="text-xs text-gray-400 p-3 text-center">정산할 차액이 없습니다 🎉</p>` : tx.map(t => `
                        <div class="p-3 bg-gray-50 rounded-2xl space-y-2">
                            <div class="flex items-center justify-between text-xs">
                                <span class="flex items-center gap-1 font-semibold text-gray-800">${iconOf(t.from)} ${t.from} <i data-lucide="arrow-right" class="w-3 h-3 text-gray-400"></i> ${iconOf(t.to)} ${t.to}</span>
                                <span class="font-bold text-amber-800">${t.amount.toLocaleString()}원</span>
                            </div>
                            <div class="flex gap-1.5">
                                <button onclick="sendViaDeeplink('kakao','${t.to}',${t.amount})" class="flex-1 py-2 bg-[#FEE500] text-[#3C1E1E] text-[11px] font-bold rounded-xl">카카오페이로 보내기</button>
                                <button onclick="sendViaDeeplink('toss','${t.to}',${t.amount})" class="flex-1 py-2 bg-[#1B64DA] text-white text-[11px] font-bold rounded-xl">토스로 보내기</button>
                            </div>
                        </div>`).join('')}
                    </div>

                    <p class="text-[11px] text-gray-400 leading-relaxed">송금 버튼을 누르면 금액이 미리 채워진 상태로 카카오페이/토스가 열려요. 실제 송금을 진행한 시점에 정산이 확정되고, 이후에도 언제든 재계산할 수 있어요.</p>
                    <button onclick="closeModal()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl transition">닫기</button>
                </div>
            </div>`;
            renderIcons();
        }

        function sendViaDeeplink(provider, toName, amount) {
            // 실제 구현 시: 카카오페이 송금링크 생성 API / supertoss://send?... 로 딥링크 오픈
            const label = provider === 'kakao' ? '카카오페이' : '토스';
            showToast(`💸 ${label} 딥링크 오픈 — ${toName}에게 ${amount.toLocaleString()}원 (송금 완료 시 정산 확정)`);
        }

        function closeModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2.5 rounded-2xl shadow-xl z-50 transition animate-bounce';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
    </script>
</body>
</html>
